<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procurar Animal Perdido</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
        }

        /* Estilo do Botão */
        .btn-procurar {
            background-color: #2563EB;
            color: white;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
            width: 100%;
        }

        .btn-procurar:hover {
            background-color: #1D4ED8;
        }

        /* Estilo dos campos que vão aparecer */
        .campo-animal {
            margin-top: 15px;
            padding: 12px;
            background-color: #F3F4F6;
            border-radius: 6px;
            border-left: 4px solid #2563EB;
        }

        .campo-animal p {
            margin: 0 0 8px 0;
            font-weight: bold;
            color: #374151;
        }

        .campo-animal input {
            width: 95%;
            padding: 8px;
            border: 1px solid #D1D5DB;
            border-radius: 4px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <button class="btn-procurar" onclick="mostrarCampos()">Procurar Animal Perdido</button>

    <div id="resultado"></div>

    <script>
        function mostrarCampos() {
            const conteiner = document.getElementById('resultado');

            // Limpa o conteúdo anterior para não duplicar se clicar de novo
            conteiner.innerHTML = '';

            // Dados dos 3 campos
            const campos = [
                { label: 'Digite o nome do primeiro animal:', placeholder: 'Ex: Rex' },
                { label: 'Digite o nome do segundo animal:', placeholder: 'Ex: Thor' },
                { label: 'Digite o nome do terceiro animal:', placeholder: 'Ex: Mel' }
            ];

            // Cria os 3 parágrafos com campo de texto
            campos.forEach((campo, index) => {
                const div = document.createElement('div');
                div.className = 'campo-animal';

                div.innerHTML = `
                    <p>Parágrafo ${index + 1}: ${campo.label}</p>
                    <input type="text" placeholder="${campo.placeholder}">
                `;

                conteiner.appendChild(div);
            });
        }
    </script>

</body>

<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Procurar por Vizinhança Pet 🐾</title>
    <style>
        /* Importa uma fonte arredondada e divertida */
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap');

        body {
            font-family: 'Fredoka', cursive, sans-serif;
            background-color: #FFF9F2; /* Fundo creme suave */
            color: #4A3E3D;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            /* Padronagem leve de patinhas no fundo */
            background-image: radial-gradient(#FFD1DC 2px, transparent 2px);
            background-size: 24px 24px;
        }

        /* Cartão principal */
        .card-pet {
            background-color: #FFFFFF;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            border: 3px solid #FFD1DC;
            width: 100%;
            max-width: 360px;
            text-align: center;
            position: relative;
        }

        /* Título decorado */
        h1 {
            font-size: 22px;
            color: #FF85A2;
            margin-bottom: 20px;
        }

        /* Botão estilizado de Pet */
        .btn-procurar {
            background-color: #FF85A2;
            color: white;
            padding: 14px 24px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Fredoka', sans-serif;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 133, 162, 0.4);
            transition: all 0.2s ease;
            width: 100%;
        }

        .btn-procurar:hover {
            background-color: #FF6B8B;
            transform: scale(1.03);
        }

        .btn-procurar:active {
            transform: scale(0.98);
        }

        /* Container dos campos (inicia escondido) */
        .container-campos {
            display: none;
            margin-top: 20px;
            text-align: left;
            animation: fadeIn 0.4s ease;
        }

        /* Animação suave ao abrir */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Grupo de campos */
        .campo-grupo {
            margin-bottom: 15px;
            background-color: #FFF5F7;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1.5px solid #FFE3E8;
        }

        .campo-grupo label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            color: #7B5264;
            margin-bottom: 4px;
        }

        .campo-grupo input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #FFC2D1;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: 'Fredoka', sans-serif;
            outline: none;
            background-color: #FFFFFF;
        }

        .campo-grupo input:focus {
            border-color: #FF85A2;
            box-shadow: 0 0 5px rgba(255, 133, 162, 0.5);
        }
    </style>
</head>
<body>

    <div class="card-pet">
        <h1>Busca Pet 🐱🐶</h1>

        <button class="btn-procurar" onclick="mostrarCampos()">Procurar por vizinhança 🐾</button>

        <div id="camposVizinhanca" class="container-campos">
            <p class="campo-grupo">
                <label for="local1">🐱 Local 1 (Gatinhos):</label>
                <input type="text" id="local1" placeholder="Ex: Praça dos Gatos">
            </p>

            <p class="campo-grupo">
                <label for="local2">🐶 Local 2 (Cãozinhos):</label>
                <input type="text" id="local2" placeholder="Ex: Parque dos Cães">
            </p>

            <p class="campo-grupo">
                <label for="local3">🐾 Local 3 (Outros):</label>
                <input type="text" id="local3" placeholder="Ex: Bairro Amigo dos Pets">
            </p>
        </div>
    </div>

    <script>
        function mostrarCampos() {
            const container = document.getElementById('camposVizinhanca');
            container.style.display = 'block';
        }
    </script>

</body>
</html>
