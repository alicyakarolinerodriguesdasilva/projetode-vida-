</html><!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exemplo de Botão</title>
    <style>
        /* Estilização do Botão */
        .meu-botao {
            background-color: #007bff; /* Cor de fundo (Azul) */
            color: white;              /* Cor do texto */
            padding: 12px 24px;        /* Espaçamento interno (cima/baixo, esquerda/direita) */
            border: none;              /* Remove a borda padrão */
            border-radius: 6px;        /* Arredonda as pontas */
            font-size: 16px;           /* Tamanho do texto */
            cursor: pointer;           /* Muda o ponteiro do mouse ao passar por cima */
            transition: background 0.3s; /* Suaviza a troca de cor */
        }

        /* Efeito quando passa o mouse por cima */
        .meu-botao:hover {
            background-color: #0056b3; /* Azul mais escuro */
        }
    </style>
</head>
<body>

    <button class="meu-botao">Clique Aqui</button>

</body>
</html>
